[project]
name = "agentos-docker"
version = "1.0.0"
description = "AgentOS: a production runtime for agents. Self-hosted Docker sibling of the agentos template family."
requires-python = ">=3.14,<4"
readme = "README.md"
license-files = ["LICENSE"]
authors = [{ name = "Agno", email = "hello@agno.com" }]

dependencies = [
  "agno[os,mcp,slack,pgvector,psycopg,csv,excel,docx,pdf,website]==3.0.4",
  "cel-python",
  "fastembed",
  "openai",
  "parallel-web",
  "python-dotenv",
  "reportlab",
]

[project.optional-dependencies]
dev = ["mypy", "ruff", "pytest"]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agents*", "app*", "db*", "evals*", "teams*", "workflows*", "shop*"]
exclude = ["shop.tests*"]
namespaces = false

[tool.setuptools.package-data]
shop = ["data/*.json", "policy.txt"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
exclude = [".venv*", "*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]

[tool.mypy]
check_untyped_defs = true
no_implicit_optional = true
warn_unused_configs = true
plugins = ["pydantic.mypy"]
# tmp/ is untracked scratch space — never part of the validated tree.
exclude = [".venv*", "tmp"]
